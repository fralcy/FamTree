<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Offline-first family tree manager.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="fam_tree">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Fam Tree</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // flutter_service_worker.js do Flutter SDK tự sinh hiện RỖNG (chỉ tự
    // unregister() ngay khi activate — Flutter đang bỏ dần cơ chế cache SW
    // built-in, xem https://github.com/flutter/flutter/issues/156910), nên
    // tự đăng ký 1 service worker riêng (app_sw.js) để app dùng offline
    // được — độc lập với flutter_bootstrap.js, không phụ thuộc Flutter có
    // giữ tính năng đó hay không ở các bản sau.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('app_sw.js').catch(function () {});
      });
    }
  </script>
  <script>
    // GitHub Pages không cho set header cache-control, nên trình duyệt có
    // thể giữ bản JS cũ dù đã deploy bản mới. Chạy đúng 1 lần mỗi khi mở
    // app: so sánh "dấu vân tay" bootstrap script với lần mở trước, khác
    // thì tự reload 1 lần rồi thôi — không polling, không banner.
    (function () {
      var KEY = 'fam_tree_bootstrap_fingerprint';
      fetch(new URL('flutter_bootstrap.js', document.baseURI), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.text() : null; })
        .then(function (fresh) {
          if (fresh == null) return;
          var stored = localStorage.getItem(KEY);
          localStorage.setItem(KEY, fresh);
          if (stored !== null && stored !== fresh) window.location.reload();
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
